version: "3.8"

services:
  api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
      - evolution-postgres
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net
    env_file:
      - .env
    expose:
      - "8080"

  frontend:
    container_name: evolution_frontend
    image: evoapicloud/evolution-manager:latest
    restart: always
    networks:
      - evolution-net
    expose:
      - "80"

  redis:
    networks:
      evolution-net:
        aliases:
          - evolution-redis

  evolution-postgres:
    networks:
      - evolution-net

volumes:
  evolution_instances:

networks:
  evolution-net:
    name: evolution-net
    driver: bridge
