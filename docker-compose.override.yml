version: "3.8"

services:
  api:
    ports:
      - "8080"
    networks:
      - evolution-net

  frontend:
    ports:
      - "80"
    networks:
      - evolution-net

  redis:
    networks:
      evolution-net:
        aliases:
          - evolution-redis

  evolution-postgres:
    networks:
      - evolution-net

networks:
  evolution-net:
    name: evolution-net
    driver: bridge
